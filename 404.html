<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — PRIMECUT</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Стили встроены сюда, чтобы страница выглядела правильно по любому адресу -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
           background: radial-gradient(circle at 30% 30%, #EFE7FF, #FFFFFF 60%); color: #000;
           font-family: "Inter", system-ui, sans-serif; }
    h1 { color: #5E0ED7; font-weight: 600; font-size: clamp(7rem, 32vw, 18rem); line-height: 1; letter-spacing: -0.05em; }
    p { margin: 16px auto 36px; max-width: 28ch; font-size: 1.2rem; }
    a { display: inline-block; padding: 16px 36px; border-radius: 999px; background: #000; color: #fff; text-decoration: none;
        font-weight: 600; font-size: .875rem; text-transform: uppercase; letter-spacing: .1em; }
    a:hover { background: #5E0ED7; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Кадр не найден. Возможно, ссылка устарела.</p>
    <a href="/" id="home">На главную</a>
    <script>
      if (location.hostname.endsWith("github.io")) {
        var seg = location.pathname.split("/")[1];
        if (seg) document.getElementById("home").href = "/" + seg + "/";
      }
    </script>
  </main>
</body>
</html>
