<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — PRIMECUT</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Стили встроены прямо сюда, чтобы страница выглядела правильно по любому адресу -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #EEF0F3; color: #1E2230;
           font-family: "Geologica", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 2rem; }
    .clip { display: inline-block; padding: .5rem .2em .05em; background: #5B4BD0; color: #fff; border-radius: 6px;
            font-size: clamp(6rem, 30vw, 14rem); font-weight: 800; line-height: .95; letter-spacing: -.05em; }
    .clip small { display: block; font-size: .75rem; font-weight: 500; letter-spacing: 0; opacity: .8; }
    p { margin: 1.5rem 0 2rem; font-size: 1.375rem; max-width: 30ch; }
    a { display: inline-block; padding: .9rem 1.75rem; border-radius: 6px; background: #1E2230; color: #fff;
        font-weight: 600; text-decoration: none; }
    a:hover { background: #5B4BD0; }
  </style>
</head>
<body>
  <main>
    <div class="clip" aria-hidden="true"><small>missing_clip.mp4</small>404</div>
    <h1 style="position:absolute;left:-9999px">Страница не найдена</h1>
    <p>Такой страницы нет. Возможно, ссылка устарела.</p>
    <a href="/" id="home">На главную</a>
    <script>
      // На адресах вида имя.github.io/репозиторий/ ведём на главную репозитория
      if (location.hostname.endsWith("github.io")) {
        var seg = location.pathname.split("/")[1];
        if (seg) document.getElementById("home").href = "/" + seg + "/";
      }
    </script>
  </main>
</body>
</html>
